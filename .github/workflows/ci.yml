name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend — Python / FastAPI
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (pyright)
        run: |
          pip install pyright
          pyright --project .

  # ---------------------------------------------------------------------------
  # Frontend — Node / TypeScript
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # ML — Python
  # ---------------------------------------------------------------------------
  ml:
    name: ML (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install ruff

      - name: Lint (ruff)
        run: ruff check .

  # ---------------------------------------------------------------------------
  # Docker build validation
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t stove-backend ./backend

      - name: Build frontend image
        run: docker build -t stove-frontend ./frontend

      - name: Build ml image
        run: docker build -t stove-ml ./ml
