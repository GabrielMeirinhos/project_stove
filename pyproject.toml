[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv", ".venv", "ml/datasets", "ml/models", "ml/checkpoints"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = ["venv", ".venv", "ml/datasets", "ml/models"]
